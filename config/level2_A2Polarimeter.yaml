name: Level2_A2Polarimeter

task_type: "a2_polarimeter"
controller_type: "a2_polarimeter"

mode: "collect"

# 场景：a2_polarimeter（A2 旋光仪测量，桌面 z=0.80）
# 布局（2026-08-27 滴管转移改造：倒液 → 胶头滴管吸 3 次挤进加液口；滴管/旋光管重摆）：
#   d2s 同款三件（跟 d2s 完全一致，复用其已证可行包络）：
#     机械臂底座 (-0.15,0.05)；试管架 (0.6803,0.3607)；试管 (0.659,0.241,0.806) 预装白粉；
#     洗瓶 (0.370,0.525) rotZ-180 红嘴朝 +X
#   A2 专用三件（全在机械臂 +x 侧）：
#     旋光仪 (0.48,-0.24) rotZ+90° 屏幕朝 -x，红色启动键 (0.30,-0.24) 顶 z 1.056，
#       导轨 (0.51,-0.24)
#     滴管 (0.6993,0.4003,0.806) 立插主试管架第二列第5排（抓点 TCP 0.936，3D 0.946m
#       贴 d2s 已证包络上限，若 IK FAIL 回退列1第5排 (0.659,0.4003)）
#     旋光管 1dm (0.5265,0.241,0.811) 桌面横放 rotZ-90°（轴 X、泡 +x、加液口 +x 端顶 0.830）
#       ——加液口 = 滴管滴液点（试管口 0.659 往 -x 10cm → 0.559），管身伸 -x 到 0.4685
#       清开试管 6.5cm；与试管同 y=0.241
#   无倒液走廊（不再横移倒液）；达记：滴管抓点 0.946m、按钮 0.64m/导轨 0.78m（+x/−y），
#   超旧 A2 0.62m 包络，若 IK FAIL 需把旋光仪收回或再旋转
usd_path: "assets/scenes/a_instrument/a2_polarimeter/a2_polarimeter.usd"

max_episodes: 1

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

# 检测阈值（gripper 开度 = joint[7]，与 flametest/d2s/a1 一致）
grasp_xy_threshold: 0.03        # 夹爪距抓点多近算"到位"
gripper_closed_threshold: 0.025 # 夹爪开合小于此值算"夹紧"
gripper_open_threshold: 0.03    # 夹爪开合大于此值算"松开"
# 洗瓶挤水判定：开合 < 此值算挤（挤水 0.020 < 0.025 < 持握 0.030，d2s 同款）
squeeze_close_threshold: 0.025

# 试管震荡周期数（TubeShakePass，controller 读 cfg.shake_cycles）
shake_cycles: 3

# 胶头滴管吸液循环数（DropperTransferPass：吸试管内液 N 次、每次挤进加液口；
# controller 读 cfg.drop_cycles、task 读同键算液面生长；默认 3 = 用户「吸三次」）
drop_cycles: 3

# 调试（用户 2026-08-28「把前面隐藏直接到移动旋光管的部分」）：true = 跳过洗瓶注水/震荡
# 溶解/滴管转移，controller 直进 PickPolarimeterTube 夹取+放导轨（只跑旋光管这一段）。
# 2026-08-28 看整体流程 → false（跑完整 10 元动作：洗瓶注水→震荡→滴管转移→放管→翻盖→按按钮）
debug_ptube_move: false

# 实验结果输入接口（运行前 --result rotation_angle=+12.5 等；task 读 cfg.rotation_angle →
# 选对应预烘焙读数屏 ScreenGlow_<key>）。档位须与 meta_actions/constants.py 与
# scripts/gen_a2_scene.py 的 ROTATION_OPTIONS 三处一致，勿单边改。引号必须保留——
# "+12.5" 是字符串 key 前缀；YAML 浮点 +12.5 会变 float，str() 对不上档位。
experiment_result:
  rotation_angle:
    label: "旋光角读数（°，显示屏显示值）"
    type: enum
    options: ["+12.5", "+8.4", "+15.0", "-3.2"]
    default: "+12.5"

rotation_angle: "+12.5"

task:
  max_steps: 30000
  obj_paths: []   # 器材静态摆放，无需随机化

cameras:
  # camera1：全景（旋光仪 + 试管架 + 洗瓶工作区）
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [0.95, 1.05, 1.50]
    resolution: [512, 512]
    focal_length: 17
    orientation: [0.2916, 0.1480, 0.4280, 0.8426]
    image_type: "rgb"

  # camera2：直拍旋光仪黑色显示屏（用户要求看读数，同 a1）：机位 (-0.02,-0.24,1.30)
  # 屏幕位 (0.185,-0.24,1.10925) 朝 -x（rotZ+90° 后），相机在屏幕 -x 侧、y 对齐、高 0.19m
  # 俯视屏幕，focal 35。四元数=[w,x,y,z] 标量在前，look-at 计算（up=+Z 保文字竖直）
  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [-0.02, -0.24, 1.30]
    resolution: [512, 512]
    focal_length: 35
    orientation: [-0.6483, -0.2823, 0.2823, 0.6483]
    image_type: "rgb"
    # 水平镜像（用户 2026-08-28「camera2 需要镜像不是旋转 180」）：读数屏文字左右反着
    # → base_task.get_camera_data 翻转宽度轴（只作用于 camera2，勿加到 camera1）
    flip_horizontal: true

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [512, 512]
    image_type: "rgb"

robot:
  type: "franka"
  # 底座 (-0.15,0.05) = d2s 原味（三件 d2s 同款 → 复用其已证包络；A2 旋光仪 (0.48,-0.24)
  # rotZ+90° 后按钮 (0.30,-0.24) 3D 0.64m、导轨 (0.51,-0.24) 3D 0.78m，均属达记项见头注释）
  position: [-0.15, 0.05, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
