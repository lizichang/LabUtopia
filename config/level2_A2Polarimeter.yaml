name: Level2_A2Polarimeter

task_type: "a2_polarimeter"
controller_type: "a2_polarimeter"

mode: "collect"

# 场景：a2_polarimeter（A2 旋光仪测量，桌面 z=0.80）
# 布局（2026-08-27 pxr 实测，gen_a2_scene.py verify；机械臂卡死重排后）：
#   旋光仪 (0.30,0.00) 屏幕朝 +y，红色启动键 (0.30,0.18) 顶 z 1.056
#   旋光管 1dm (0.70,0.30,0.811) 桌面横放泡朝上（+y 端泡、+z 加液口顶 0.830）
#   试管架 (0.82,0.55) 架顶 z 0.917；试管 (0.799,0.43,0.806) 管口 z 0.9593，预装白粉
#   洗瓶 (-0.10,0.60) rotZ-180 红嘴朝 +X（对试管方向），瓶身 z 0.80..0.97
#   机械臂底座 (0.30,0.50,0.71)：全部路径点 3D ≤0.67m（已证可行包络；
#   旧 0.65 时洗瓶 0.76m/旋光管 0.82m/放管 0.75m IK 卡死乱动）
usd_path: "assets/scenes/a_instrument/a2_polarimeter/a2_polarimeter.usd"

max_episodes: 1

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

# 检测阈值（gripper 开度 = joint[7]，与 flametest/d2s/a1 一致）
grasp_xy_threshold: 0.03        # 夹爪距抓点多近算"到位"
gripper_closed_threshold: 0.025 # 夹爪开合小于此值算"夹紧"
gripper_open_threshold: 0.03    # 夹爪开合大于此值算"松开"
# 洗瓶挤水判定：开合 < 此值算挤（挤水 0.020 < 0.025 < 持握 0.030，d2s 同款）
squeeze_close_threshold: 0.025

# 试管震荡周期数（TubeShakePass，controller 读 cfg.shake_cycles）
shake_cycles: 3

# 实验结果输入接口（运行前 --result rotation_angle=+12.5 等；task 读 cfg.rotation_angle →
# 选对应预烘焙读数屏 ScreenGlow_<key>）。档位须与 meta_actions/constants.py 与
# scripts/gen_a2_scene.py 的 ROTATION_OPTIONS 三处一致，勿单边改。引号必须保留——
# "+12.5" 是字符串 key 前缀；YAML 浮点 +12.5 会变 float，str() 对不上档位。
experiment_result:
  rotation_angle:
    label: "旋光角读数（°，显示屏显示值）"
    type: enum
    options: ["+12.5", "+8.4", "+15.0", "-3.2"]
    default: "+12.5"

rotation_angle: "+12.5"

task:
  max_steps: 30000
  obj_paths: []   # 器材静态摆放，无需随机化

cameras:
  # camera1：全景（旋光仪 + 试管架 + 洗瓶工作区）
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [0.75, 0.85, 1.50]
    resolution: [512, 512]
    focal_length: 17
    orientation: [0.2916, 0.1480, 0.4280, 0.8426]
    image_type: "rgb"

  # camera2：直拍旋光仪黑色显示屏（用户要求看读数，同 a1）：机位 (0.30,0.50,1.30)
  # 朝 -y 前方看屏幕，focal 35 让屏幕占画面 ~48%
  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.30, 0.50, 1.30]
    resolution: [512, 512]
    focal_length: 35
    orientation: [0.0, 0.0, 0.4099, 0.9122]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [512, 512]
    image_type: "rgb"

robot:
  type: "franka"
  # 底座 (0.30,0.50)：旋光仪正后方 +y（2026-08-27 布局重排：洗瓶→(-0.10,0.60)、旋光管→(0.70,0.30)，
  # 全部路径点 3D 距离 ≤0.67m 进入已证可行包络；旧 0.65 时洗瓶 0.76m/管 0.82m/放管 0.75m IK 卡死）
  position: [0.30, 0.50, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
