name: Level2_B1AlcoholHeatSolid

task_type: "b1_alcohol_heat_solid"
controller_type: "b1_alcohol_heat_solid"

mode: "collect"

# 场景：b1_alcohol_heat_solid（B1 酒精灯加热固体样品，桌面 z=0.80）
# 本批次只跑三个过程（用户 2026-08-27：「先写咬粉末咬进试管里面，然后拿起酒精灯盖儿放到
# 一边儿，再拿起火柴点燃酒精灯，这几个过程先只写这些我来验收」）：
#   ① 药匙挖粉末倒进试管（D2S 逐字坐标）
#   ② 拿起酒精灯盖放到一边（OpenCapPass，纯平移持握）
#   ③ 取火柴点燃酒精灯（LightFlamePass，火柴头触灯芯 → 直接 reveal 火焰，无温度模型）
# 拿试管→外焰预热（倾斜 10-15°）→集中加热→熄灭→归位留待验收后接续。
#
# 台面（2026-08-27 pxr 实测世界 bbox，gen_b1_scene.py verify 输出）：
#   挖粉区 = D2S 逐字：试管架 (0.6803,0.3607) 顶板 z0.917、试管 (0.659,0.241,0.806) 口 z0.9593、
#     药匙 (0.6993,0.3608,0.828) 竖插、表面皿 (0.5365,0.105) / 粉丘 (0.5383,0.0992)
#   酒精灯 AlcoholLamp (0.50,0.0029)：玻璃罩 z[0.80,0.8897]、灯芯顶 0.9007、灯帽 cap 盖灯口
#     （Ø37.2×31mm 钟罩，世界中心 (0.50,0.0029,0.8917)）、火焰 flame_outer/flame_inner 初始隐藏
#   火柴 Match (0.40,-0.06) 原点 z0.813（抬高 12mm），头=asset +X 端朝灯芯（同 B2）
#   药粉下落：PowderOnSpoon（勺上粉堆）+ PowderDrop（父+14 粒，初始隐藏）+ TubePowder
#     （管内白粉柱，⑬ 倒粉后 reveal，rest 中心 0.84）
usd_path: "assets/scenes/b_thermal/b1_alcohol_heat_solid/b1_alcohol_heat_solid.usd"

max_episodes: 1

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

# 检测阈值（与 d2s/d3s 一致；gripper 开度 = joint[7]）
grasp_xy_threshold: 0.03        # 夹爪距药匙/灯帽/火柴抓点多近算"到位"
gripper_closed_threshold: 0.025 # 夹爪开合小于此值算"夹紧"（药匙/灯帽/火柴 attached）
gripper_open_threshold: 0.03    # 夹爪开合大于此值算"松开"（放回药匙/灯帽/火柴 released）

task:
  max_steps: 30000
  obj_paths: []   # 器材静态摆放，无需随机化

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    # 沿用 d3s（D2S 挖粉区同款取景：皿/粉/试管架 x0.53-0.70 居画面中心）；酒精灯
    # (0.50,0.003) 在画面近心、火柴 (0.40,-0.06) 在左下。取景不佳可平移微调（用户目检）
    translation: [1.20, 0.40, 1.15]
    resolution: [512, 512]
    focal_length: 10
    orientation: [0.38519, 0.13095, 0.29403, 0.86489]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    # 俯视总览，与其他实验共享四元数；机位框住 B1 工作区（挖粉区 x0.53-0.70 + 灯/火柴
    # x0.40-0.63 两侧）
    translation: [0.55, 0.08, 1.50]
    resolution: [512, 512]
    focal_length: 10
    orientation: [0.9425, 0.10815, 0.03605, 0.31417]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [512, 512]
    image_type: "rgb"

robot:
  type: "franka"
  # 底座与 d2s 完全一致 [-0.15, 0.05, 0.71]（用户先决条件：「机械臂坐标一定要复刻 D2S，
  # 粉末才挖得准」；不动底座，挖粉动作坐标才不跑偏）。B1 无铁架台，灯/火柴在台面前区，
  # 底座不需再后移。
  position: [-0.15, 0.05, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
