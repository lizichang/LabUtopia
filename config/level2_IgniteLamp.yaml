name: Level2_IgniteLamp

task_type: "ignitelamp"
controller_type: "ignitelamp"

mode: "collect"

# 场景：lab_001（酒精灯已放置在 /World/AlcoholLamp，桌面 z≈0.80）
usd_path: "assets/scenes/base/lab_001/lab_001.usd"

max_episodes: 100

infer:
  type: "remote"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 31002
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

# ---- 酒精灯相关路径与参数（IgniteLampTask 使用）----
# 灯在场景中的引用 prim 路径（部件在其下：/cap /body /wick_tip /flame_outer /flame_inner）
lamp_path: "/World/AlcoholLamp"

# 帽的放置点 = 灯底座位置 + 该偏移（放到桌面旁）
# 放到 -y 侧（机器人同侧），x 收小一点，避免夹爪/手臂跨过灯身造成穿模
# z 取帽的半高(≈0.0155)，使帽底刚好落在桌面(0.80)上不悬空
cap_rest_offset: [0.07, -0.15, 0.015]
# 点火点 = 灯芯顶端 + 该偏移（夹爪悬停在灯芯旁）
ignite_offset: [0.03, 0.0, 0.01]

# 检测阈值（一般不用改）
grasp_xy_threshold: 0.03        # 夹爪距帽中心多近算"到位"
gripper_closed_threshold: 0.025 # 夹爪开合小于此值算"夹紧"
gripper_open_threshold: 0.03    # 夹爪开合大于此值算"松开"
ignite_xy_threshold: 0.02       # 夹爪距点火点多近算"靠近"
ignite_dwell_frames: 25         # 靠近点火点连续多少帧后点着火

task:
  max_steps: 2500
  obj_paths: []   # 灯是静态的，无需随机化的物体

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [2, 0, 2]
    resolution: [256, 256]
    focal_length: 5
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.1, 0, 2.5]
    resolution: [256, 256]
    focal_length: 5
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
