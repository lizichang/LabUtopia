name: Level2_D2SWaterSolubility

task_type: "d2s_water_solubility"
controller_type: "d2s_water_solubility"

mode: "collect"

# 场景：lab_d2s_water_solubility（D2-S 固体水溶性测试专用布局，桌面 z=0.80）
# 台面（2026-08-14 pxr 实测世界 bbox）：
#   试管架 (0.257,-0.143,0.8)-(0.343,0.143,0.914)、试管 (0.279,0.119) 架内、口 z 0.959
#   药匙 竖插架前排右孔 (0.317,0.119)、勺头在下 z 0.806-0.830、柄杆在上 z 0.830-0.963
#   表面皿 (0.27,-0.35,0.800)-(0.33,-0.29,0.807)、粉丘在皿内 (0.282,-0.344,0.802)-
#     (0.318,-0.296,0.814)、洗瓶 (0.41,0.03,0.80)-(0.55,0.09,0.99)
usd_path: "assets/scenes/d_wetchem/d2s_water_solubility/d2s_water_solubility.usd"

max_episodes: 1

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

# 检测阈值（一般不用改；gripper 开度 = joint[7]，与 flametest 一致）
grasp_xy_threshold: 0.03        # 夹爪距药匙抓点多近算"到位"
gripper_closed_threshold: 0.025 # 夹爪开合小于此值算"夹紧"
gripper_open_threshold: 0.03    # 夹爪开合大于此值算"松开"
shake_cycles: 5                 # S6 试管震荡来回次数

# 实验结果输入接口（运行前 --result solubility=soluble liquid_color=blue 等；task 读 cfg.solubility 等）
# 现象三档（用户 2026-08-25 描述）：三档都先「整管逐渐变浑浊」（震荡中浑浊云盖满液柱），停震后分化：
#   soluble（可溶）        浑浊渐澄清 + 液体变成输入色（全），粉末溶尽
#   insoluble（不溶）      浑浊渐沉淀 + 粉末停留试管底部，液体回溶剂水色
#   slightly_soluble（微溶）粉末停留试管底部 + 液体渐渐变成输入色但比输入色浅
# liquid_color = 粉末颜色兼（若可溶）溶解后液体颜色；默认 white（保持现在白色）。
experiment_result:
  solubility:
    label: "溶解情况（可溶/不溶/微溶）"
    type: enum
    options: [soluble, insoluble, slightly_soluble]
    default: soluble
  liquid_color:
    label: "粉末/溶解液颜色"
    type: enum
    options: [white, red, blue, green, purple]
    default: white

# 顶层镜像（写回目标）：结构化 config 需先声明字段，main.py 才能 cfg[field]=值 写回。
solubility: soluble
liquid_color: white

task:
  max_steps: 30000
  obj_paths: []   # 器材静态摆放，无需随机化

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [1.20, 0.40, 1.15]
    resolution: [512, 512]
    focal_length: 10
    orientation: [0.38519, 0.13095, 0.29403, 0.86489]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.8, 0.1, 1.44]
    resolution: [512, 512]
    focal_length: 10
    orientation: [0.9425, 0.10815, 0.03605, 0.31417]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [512, 512]
    image_type: "rgb"

robot:
  type: "franka"
  # 历史（2026-08-23）：⑧ ShiftYNeg 终点曾 15cm=(0.537,0.2108,0.95) 贴底座柱（相对 y 0.04）→
  # Lula 解不出位置+朝向都通过的 IK → MoveAction 静默 hold 冻结到 force-done，退底座 0.17→0.05；
  # 同日用户改 18→23cm，23cm 终点(0.537,0.1308,0.95) 相对 y 又回到 <0.10 失效区（贴底座会再冻结）。
  # 2026-08-24 改用「皿+粉 +Y 移 6.5cm + ⑧平移量 23→16cm」解法（用户要求，不动底座）：⑧终点
  # TCP y=0.3608-0.16=0.2008，相对底座 y=0.15 脱离失效区，勺尖 y=0.1058 仍到新粉丘正上方。
  # 底座位置保持 [-0.15, 0.05, 0.71]（勿动；判据：关键终点相对底座 y ≥0.15 才稳）。
  position: [-0.15, 0.05, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
