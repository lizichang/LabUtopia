name: Level2_B5MeltingPoint

task_type: "b5_melting_point"
controller_type: "b5_melting_point"

mode: "collect"

# 场景：b5_melting_point（B5 熔点测定·提勒管法，桌面 z=0.80）
# 本批次 = 装样五段（用户 2026-08-30「第一个动作拿起毛细管」+「先转着竖过来，然后竖着插进
# 粉丘里面」+ 2026-08-31「反过来这个毛细管，然后只在竖直方向上下快速来回运动10次」）：
#   ① PickCapillaryPass —— 拿起台面上的毛细管（熔点管 Ø1.5×100mm，水平躺台面前区，
#      闭口端 (0.40,0.15)、开口端 (0.50,0.15)，中心抬高 12mm 到 z=0.813 防夹爪扎桌面）：
#      高位接近 → 竖直下探夹管身中部（两指竖直夹 Ø1.5mm 杆身，照 b2 火柴 LightFlamePass）
#      → 停顿稳定 → 合爪 → 竖直提起。
#   ② RotateCapillaryVertical → ③ DipCapillaryIntoPowder → ④ FlipCapillaryToSeal
#   → ⑤ TampCapillary（竖直快速来回 10 次震实）。
#   ⑦ 抓温度计（平躺夹起机械臂原地旋转立起来泡朝下）⑧ 蘸石蜡油 ⑨ 贴毛细管吸附 ⑩ 插提勒管；
#   ⑬ 火柴点燃酒精灯 → ⑭ 夹灯 X 摆动 15s 控温（油浴对流+样品熔化）→ ⑮ 移灯 -X 5cm → ⑯ 盖帽熄火（2026-09-03 已实现）。
#
# 台面（2026-09-02 pxr 实测世界 bbox，gen_b5_scene.py verify 输出）：
#   提勒管 ThieleTube (0.40,0.0029) 底 0.928 口 1.078，侧管 V 顶点（加热点）x=0.355 z=0.9795；
#   酒精灯 AlcoholLamp (0.355,0.0029) 同轴，火焰尖 0.9795；铁架台 + 试管夹夹主管上部；
#   石蜡油 ParaffinOil 主管内液柱（静态）；毛细管 CapillaryTube (0.40,0.15,0.813)；
#   表面皿 SurfaceDish (0.33,0.30) + 粉丘 SamplePowder；主温度计 MainThermometer (0.5340,0.2745)
#   倒插试管架左前孔泡朝上；蘸油皿 OilDish (0.25,0.15)；试管架 TestTubeRack (0.5528,0.3933)；
#   火柴 Match (0.40,-0.06,0.813)。
usd_path: "assets/scenes/b_thermal/b5_melting_point/b5_melting_point.usd"

max_episodes: 1

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

# 检测阈值（与 b1/b2 一致；gripper 开度 = joint[7]）
grasp_xy_threshold: 0.03        # 夹爪距毛细管抓点多近算"到位"
gripper_closed_threshold: 0.025 # 夹爪开合小于此值算"夹紧"（毛细管 attached）
gripper_open_threshold: 0.03    # 夹爪开合大于此值算"松开"（毛细管 released）

# 温度模型（B5 熔点测定）：熔点由输入决定（experiment_result.melting_point，CLI --result 覆盖），
# 点火后温度从室温按 heat_rate 线性上升，15s（HEAT_SWAY_CYCLES×HEAT_SWAY_PERIOD=900 帧）夹灯
# X 摆动结束正好升到熔点 → 样品固体熔化（SamplePlug 隐藏/SampleMelt 显示）+ 油浴对流气泡上升；
# 移灯 -X 5cm 后盖帽熄火 → done。heat_rate 由 task 内部按 (熔点-室温)/900 计算（与 15s 摆动同步），
# 无需配置。
# debug_heat_move=true：跳过段1（装样+挂温度计+点火），任务直进 heating 相只跑 LampHeatMovePass
#   （夹灯摆动 15s + 移灯 -X 5cm）；debug_cap_lamp=true：跳过段1+加热+移灯，灯预摆移灯位+火焰
#   点亮，任务直进 cap_lamp 相只跑 CapLampPass 盖帽熄火。
room_temp: 25.0              # 室温起始温度（°C）
ignite_dwell_frames: 30      # 点火后停留帧数（火焰亮起到开始升温）
cap_dwell_frames: 15         # 盖帽到位判定的停留帧数（夹爪距 LAMPCAP_BURNER < cap_cover_near
                             #   连续 15 帧 → cap settled → 火焰熄灭、帽锁灯口）
cap_result_hold_frames: 180  # 熄火后停留帧数（cap settled 火灭后再停留 180 帧=3s 才 done，
                             #   视频能看到「盖好+火灭+熔化结果」再结束，同用户「机械臂运动结束
                             #   后视频再多拍3s」）
debug_heat_move: false       # 调试：true = 跳过段1，任务直进 heating 相只跑 LampHeatMovePass
debug_cap_lamp: false        # 调试：true = 跳过段1+加热+移灯，任务直进 cap_lamp 相只跑 CapLampPass

# 实验结果输入接口（运行前 --result melting_point=158 等覆盖；task 读 cfg.melting_point 顶层镜像）
# 2026-09-03 用户「熔点通过输入决定」：熔点 = 输入数字（number），驱动加热 15s 升温目标 + 样品
# 熔化相变判定（T>=熔点 → SamplePlug 隐藏、SampleMelt 显示）。
experiment_result:
  melting_point:
    label: "测得样品熔点（°C）"
    type: number
    default: 158.0
melting_point: 158.0    # 顶层镜像键（main.py 无条件写回 cfg.melting_point，缺则 ConfigKeyError）

task:
  max_steps: 30000
  obj_paths: []   # 器材静态摆放，无需随机化

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    # 前景取景：毛细管 (0.40-0.50,0.15) + 表面皿 (0.33,0.30) 居画面（主温度计已挪 (0.5340,0.2745)，视线可能偏，待用户目检）。
    # 取景不佳可平移微调（用户目检）。
    translation: [0.80, 0.55, 1.50]
    resolution: [512, 512]
    focal_length: 10
    orientation: [0.38519, 0.13095, 0.29403, 0.86489]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    # 温度计刻度特写（2026-09-03 用户「跟 b2 类似的从 -y 朝 +y 拍摄温度计」，摄加热工作位）：
    #   刻度已由 gen_b5_scene rotate_thermo_scale 把 stem/bulb/scale 等 6 部绕 z +90°（asset +X→+Y，
    #   再经外层 X-翻转 → 世界 -Y），朝 camera_2；温度计 ⑫ 插入提勒管后在工作位
    #   (x=0.397,y=0.0059) 直立，管口 z=1.078 上方露刻度段 ~1.08-1.20 → 相机放 -Y 侧平视 +Y
    #   直拍刻度段（orientation [0.7071,0.7071,0,0] = 沿 +Y 看、+Z 朝上，同 b2 camera_2）。
    #   酒精灯/铁架台在刻度段下方(z<0.95)不进画面；取景/对焦不佳可平移 translation.z 或调
    #   focal_length 微调（用户目检）。
    translation: [0.397, -0.72, 1.15]
    resolution: [1024, 1024]
    focal_length: 35
    orientation: [0.7071, 0.7071, 0.0, 0.0]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [512, 512]
    image_type: "rgb"

robot:
  type: "franka"
  # 底座 2026-09-02 用户再调「x=-0.048, y=-0.311」→ [-0.048, -0.311, 0.71]：
  # 解决温度计挪右后区后的可达性回归——温度计夹点 (0.5340,0.2745,1.000) 距底座 0.875m 卡极限内，
  # 插管对齐 (0.40,0.0029,1.18) 0.844→0.721m、毛细管/油皿/表面皿全 <0.72m 大幅改善。
  # ⚠ 温度计提出高位 THERMO_HIGH=1.25 距底座 0.987m 仍超 0.885m，提出段可能 IK 发散（待运行确认）。
  position: [-0.048, -0.311, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
