name: Level2_Dissolve

task_type: "dissolve"
controller_type: "dissolve"

mode: "collect"

# 场景：lab_004（药匙 /World/Spoon、粉末堆 /World/SamplePowder、试管 /World/TestTube、
# 试管架 /World/TestTubeRack、洗瓶 /World/WashBottle、勺上粉末 /World/PowderOnSpoon、
# 管内粉末 /World/TubeSample、管内液面 /World/TubeWater 已引用/内建进场景）
usd_path: "assets/chemistry_lab/lab_004/lab_004.usd"

max_episodes: 100

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

# ---- 场景 prim 路径（DissolveTask 使用）----
spoon_path: "/World/Spoon"                 # 药匙（kinematic，原点=手柄中点）
powder_path: "/World/SamplePowder"         # 样品粉末堆（静态）
tube_path: "/World/TestTube"               # 试管（静态，插在架上，原点=管底）
wash_path: "/World/WashBottle"             # 蒸馏水洗瓶（kinematic，原点=瓶底）
powder_on_spoon_path: "/World/PowderOnSpoon"  # 勺上粉末（初始隐藏，跟随勺头）
tube_sample_path: "/World/TubeSample"      # 试管内粉末（初始隐藏）
tube_water_path: "/World/TubeWater"        # 试管内液面（初始隐藏）

# ---- 偏移参数 ----
# 勺头中心 = 夹爪 + 该偏移（+x 端；夹爪抓在手柄中点，药匙平移跟随）
spoon_head_offset: [0.045, 0.0, 0.0]
# 勺头插入粉末堆的深度（相对堆中心，负=插入）
scoop_insert_offset: [0.0, 0.0, -0.002]
# 洗瓶举到试管口上方的额外高度（相对试管口）
wash_pour_lift: 0.06
# 振荡位 = 试管口 + 该偏移
shake_offset: [0.0, 0.0, 0.05]
# 洗瓶抓取位 = 瓶底 + 该偏移（瓶颈，直径约 20mm）
wash_grasp_offset: [0.0, 0.0, 0.090]

# ---- 检测阈值（一般不用改）----
grasp_xy_threshold: 0.03          # 夹爪距抓取点多近算"到位"
gripper_closed_threshold: 0.025   # 夹爪闭合阈值（闭合目标必须小于它）
gripper_open_threshold: 0.03      # 夹爪打开阈值（松开即释放）
scoop_dwell_frames: 25            # 勺头在粉末堆内连续帧数 -> 勺上粉末 reveal
transfer_dwell_frames: 25         # 勺头在试管口内连续帧数 -> 粉末入管
pour_dwell_frames: 25             # 洗瓶在倒水位连续帧数 -> 液面 reveal
shake_dwell_frames: 60            # 夹爪在振荡区域连续帧数 -> 溶解完成
obs_dwell_frames: 30              # 溶解后连续帧数 -> 观察完成
shake_region_radius: 0.15         # 夹爪距振荡位多远算"在振荡区域"

task:
  max_steps: 4000

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [2, 0, 2]
    resolution: [256, 256]
    focal_length: 5
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.1, 0, 2.5]
    resolution: [256, 256]
    focal_length: 5
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
