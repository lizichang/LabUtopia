name: Level2_HeatLamp

task_type: "heatlamp"
controller_type: "heatlamp"

mode: "collect"

# 场景：lab_003（酒精灯 /World/AlcoholLamp、蒸汽 /World/Steam 已引用进场景；烧杯为场景原有）
usd_path: "assets/chemistry_lab/lab_003/lab_003.usd"

max_episodes: 100

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

# ---- 酒精灯与蒸汽路径及参数（HeatLampTask 使用）----
lamp_path: "/World/AlcoholLamp"
steam_path: "/World/Steam"
# 夹爪悬停加热位 = 灯根 + 该偏移（烧杯底部进入火焰区）
heat_offset: [0.0, 0.0, 0.27]

# 检测阈值（一般不用改）
heat_xy_threshold: 0.03      # 夹爪距加热位多近算"到位"
heat_dwell_frames: 25        # 在加热位连续停留多少帧后开始加热（点火+蒸汽）

task:
  max_steps: 2500
  obj_paths:
    - path: "/World/beaker_2"
      position_range:
        x: [0.13, 0.28]
        y: [0.05, 0.2]
        z: [0.77, 0.775]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [2, 0, 2]
    resolution: [256, 256]
    focal_length: 5
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.1, 0, 2.5]
    resolution: [256, 256]
    focal_length: 5
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
