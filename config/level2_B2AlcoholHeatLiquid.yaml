name: Level2_B2AlcoholHeatLiquid

task_type: "b2_alcohol_heat_liquid"
controller_type: "b2_alcohol_heat_liquid"

mode: "collect"

# 场景：b2_alcohol_heat_liquid（B2 沸点测定，桌面 z=0.80）
# 台面（2026-08-25 pxr 实测世界 bbox，依据用户 tmp 整组绕Z180°+平移后的布局）：
#   加热台（垂直堆叠中心线 x=0.5286，铁柱 −X 侧）：铁架台 (0.6286,0.0029) 柱 z[0.80,1.26]、
#     石棉网 (0.5286,0.0029) z[0.9184,0.9205]、试管 (0.5286,0.0029) 底 0.9206 口 1.0739（试管夹夹上部）、
#     酒精灯 (0.5286,0.0029) z[0.80,0.9007]（火焰初始隐藏，灯帽已挪到灯 y-0.4827 侧）
#   试管架 (0.50,0.35) z[0.80,0.917]：滴管插左孔 (0.481,0.3496)、温度计插右孔 (0.519,0.3496)
#   阶段A 新器材（2026-08-25 用户：沸石放玻璃皿上）：玻璃皿 SurfaceDish (0.40,0.28) z[0.80,0.8065]、
#     沸石 Zeolite 叠皿上 (0.40,0.28) z[0.8066,0.8101]、样品瓶 SampleBottle (0.40,0.15) z[0.80,0.879]、
#     火柴 Match (0.40,-0.06) 头朝灯芯（火柴头=asset +X 端，x[0.40,0.4978]）——布局供用户目检微调
#   效果 prim：TestTubeLiquid（管内水柱初始隐藏 h0，滴加后逐滴生长，上限液顶 0.9806）、
#     SampleLiquid（样品瓶内半瓶液可见 0.80..0.84）、DropperFill（滴管尖内吸起液柱，初始隐藏，
#     吸液后跟随尖嘴）、DropperDrop（挤胶头滴落球×4，初始隐藏）、TestTubeBubbles（气泡×6）、
#     Steam（蒸汽×5，后两初始隐藏）——task 动画驱动
usd_path: "assets/scenes/b_thermal/b2_alcohol_heat_liquid/b2_alcohol_heat_liquid.usd"

max_episodes: 1

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

# 温度模型（B2 沸点测定）：点火后温度从室温按 heat_rate 上升，到达沸点后保持并沸腾
room_temp: 25.0            # 室温起始温度（°C；温度计毛细柱初始读数也在此）
heat_rate: 0.08            # 加热速率（°C/帧，60fps 下 25→100°C 约 16s；调大可加速演示）
idle_dwell_frames: 20      # 点火前停留帧数（火焰未亮、温度=室温）
ignite_dwell_frames: 30    # 点火后停留帧数（火焰亮起到开始升温）
boil_dwell_frames: 240     # 沸腾保持帧数（冒泡/蒸汽持续，之后记录沸点完成）

# 阶段B 滴加（V7 步骤 2-3）：机械臂抓滴管吸样品瓶液 → 滴入试管出液柱。
# 夹爪阈值同 d3l（GRIP_DROPPER=0.0055 贴胶头、GRIP_SQUEEZE=0.002 挤胶头），
# 吸液-滴液一次持握内循环 sample_cycles 遍，每遍 4 滴（液柱 48mm < 上限 60mm）。
sample_cycles: 3              # 一次持握内「吸液-滴液」循环遍数
grasp_xy_threshold: 0.03      # 进近判定：TCP 距目标点 xy 水平距 < 3cm 视为到达
gripper_closed_threshold: 0.025   # 夹爪合拢（抓滴管完成 attached）
gripper_open_threshold: 0.03      # 夹爪松开（放回滴管 released）
squeeze_close_threshold: 0.0035   # 挤胶头（排空气/滴液瞬间，开度 < 此值）

# 实验结果输入接口（运行前 --result boiling_point=97 等覆盖；task 读 cfg.boiling_point 顶层镜像）
experiment_result:
  boiling_point:
    label: "测得液体沸点（°C）"
    type: number
    default: 100.0
boiling_point: 100.0    # 顶层镜像键（main.py 无条件写回 cfg.boiling_point，缺则 ConfigKeyError）

task:
  max_steps: 30000
  obj_paths: []   # 器材静态摆放，无需随机化

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    # 与其他实验(D2S/D3L/焰色)共享同一四元数：right 纯水平(z=0)地平线正、无 roll；
    # 机位沿用焰色/D3L(0.50,0.30,1.15)。2026-08-25 堆叠移到 x≈0.53 后视线偏试管架侧，
    # 加热区可能偏出中心——如取景不理想可平移 camera 微调（用户目检确认）
    translation: [0.80, 0.50, 1.45]
    resolution: [512, 512]
    focal_length: 10
    orientation: [0.38519, 0.13095, 0.29403, 0.86489]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    # 俯视总览，与其他实验 camera_2 共享四元数；机位框住 B2 工作区(堆叠0.53+架0.50,0.35)
    translation: [0.46, 0.06, 1.50]
    resolution: [512, 512]
    focal_length: 10
    orientation: [0.9425, 0.10815, 0.03605, 0.31417]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [512, 512]
    image_type: "rgb"

robot:
  type: "franka"
  # 阶段B 滴加：base 放 (0.0,0.0) 使所有关键点可达且余量足——最大点=滴管架上空
  # 平移 (0.481,0.3496,1.25)→0.803m，试管滴液 0.741m、瓶口 0.519m、灯帽 0.711m，
  # 均 < 臂展 0.8557m。2026-08-25 用户实测 -0.10 处架位超臂展 1.1cm 够不到 → 定 0.0。
  # 水平跨越时 H=1.25 清钩顶 1.2273 + 夹爪球 5.5mm
  position: [0.0, 0.0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
