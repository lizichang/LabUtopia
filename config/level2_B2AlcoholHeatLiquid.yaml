name: Level2_B2AlcoholHeatLiquid

task_type: "b2_alcohol_heat_liquid"
controller_type: "b2_alcohol_heat_liquid"

mode: "collect"

# 场景：b2_alcohol_heat_liquid（B2 沸点测定，桌面 z=0.80）
# 台面（2026-08-25 pxr 实测世界 bbox，依据用户 tmp 整组绕Z180°+平移后的布局）：
#   加热台（垂直堆叠中心线 x=0.5286，铁柱 −X 侧）：铁架台 (0.6286,0.0029) 柱 z[0.80,1.26]、
#     石棉网 (0.5286,0.0029) z[0.9384,0.9405]、试管 (0.5286,0.0029) 底 0.9406 口 1.0939（试管夹夹上部）、
#     酒精灯 (0.5286,0.0029) z[0.80,0.9007]（火焰初始隐藏，灯帽已挪到灯 y-0.4827 侧）
#     （2026-08-27 铁架台上整套——铁环/挂钩/石棉网/试管/试管夹——上移 2cm，酒精灯+火焰未动；
#       火焰底座从灯芯顶 0.9005 下移到灯芯根部 0.891（包裹外露灯芯），并改水滴形加长：
#       外焰 = 底半球 Sphere r9 + 上部 Cone 收尖，apex 0.9384 刚好碰石棉网底（不再是尖锥，
#       用户：火焰不该是锥形应该像水滴底部是圆），内焰焰心更小 apex 0.913；
#       焰色 = 外焰偏蓝（B 主导 emissive 0.35/0.55/2.40）、内焰偏黄（R 主导 2.80/0.55/0.20）；
#       温度计玻璃管绕竖轴 -90°（刻度面从 +X 转到 -Y 朝 camera_2、白底转 +Y 衬后），挂环方向不变）
#   试管架 (0.50,0.35) z[0.80,0.917]：滴管插左孔 (0.481,0.3496)、温度计插右后排孔 (0.521,0.468)
#     （2026-08-25 用户：右中排温度计顶高1.084 挡机械臂下探滴管 → 移 y 值最大=最远孔）
#   阶段A 新器材（2026-08-25 用户：沸石放玻璃皿上）：玻璃皿 SurfaceDish (0.40,0.28) z[0.80,0.8065]、
#     沸石 Zeolite/Zeolite2 两颗并排叠皿上 (0.39,0.28)/(0.41,0.28) z[0.8066,0.8139]
#     （2026-08-27 重建为 10.8×10.8×7.3mm 不规则白色颗粒，底 z=0 贴皿顶；中心 0.810，
#     阶段C 机械臂竖直夹起后水平伸到试管上方依次放入两颗，第二颗叠第一颗顶）、
#     样品瓶 SampleBottle (0.40,0.15) z[0.80,0.879]、
#     火柴 Match (0.40,-0.06) 头朝灯芯（火柴头=asset +X 端，x[0.40,0.4978]；2026-08-27 抬高
#     12mm 到原点 z=0.813 供阶段E 机械臂夹取点燃酒精灯）——布局供用户目检微调
#   效果 prim：TestTubeLiquid（管内水柱初始隐藏 h0，滴加后逐滴生长，上限液顶 0.9806）、
#     SampleLiquid（样品瓶内半瓶液可见 0.80..0.84）、DropperDrop（挤胶头滴落球×4，初始隐藏）、
#     TestTubeBubbles（气泡×16，初始隐藏；2026-08-27 加热 8s 内随温度逐个 reveal、沸腾全亮）
#     ——task 动画驱动。DropperFill（滴管尖内固定液柱）已删（2026-08-25 用户：固定竖直液柱+
#     移动浅色轨迹太假，参考 d2l 无液柱）。蒸汽两段式（steam_inner/plume）已删（2026-08-27
#     用户「整体去掉蒸汽的显示」→ 沸腾只留气泡动画）；沸腾保持 5s 后新增移灯动作
#     （LampMovePass：水平横夹灯体宽处 z=0.845 → -y 移 10cm，xz/朝向不变）；
#     移灯期间气泡继续沸腾，松爪（灯移到位）后气泡逐个逐渐熄灭
usd_path: "assets/scenes/b_thermal/b2_alcohol_heat_liquid/b2_alcohol_heat_liquid.usd"

max_episodes: 1

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

# 温度模型（B2 沸点测定）：点火后温度从室温按 heat_rate 上升（8s，气泡随进度逐个出现），
# 到达沸点后保持并沸腾（气泡全亮 16 泡）→ 沸腾保持 boil_dwell 5s → move_lamp（机械臂
# 水平横夹灯体宽处 -y 移 10cm；移灯期间气泡继续沸腾，松爪后气泡逐个逐渐熄灭）→ done
# debug_lamp_move=true：跳过段1（滴加/沸石/温度计/点火），任务直进 move_lamp 相，只跑
# LampMovePass 抓灯移灯（用户 2026-08-27「先把前面的动作都隐藏就先做这一个动作」）
room_temp: 25.0            # 室温起始温度（°C；温度计毛细柱初始读数也在此）
heat_rate: 0.15625         # 加热速率（°C/帧；2026-08-27 用户「从点燃酒精灯 沸腾需要8秒」：
                           #   25→100°C 差 75，/0.15625 = 480 帧 = 8s @60fps，此间机械臂不动）
idle_dwell_frames: 20      # 点火前停留帧数（火焰未亮、温度=室温）
ignite_dwell_frames: 30    # 点火后停留帧数（火焰亮起到开始升温）
boil_dwell_frames: 300     # 沸腾保持帧数（2026-08-27 用户「沸腾等待5秒之后新增动作」：
                           #   300 帧 = 5s @60fps，之后进入 move_lamp 相移灯；沸腾期间气泡不熄）
bubble_fade_frames: 240    # 移灯后气泡逐渐熄灭帧数（2026-08-27 用户「只有把酒精灯移走之后
                           #   气泡才慢慢减少消失」：240 帧 = 4s @60fps，16 泡逐个熄灭 → done）
cap_dwell_frames: 15       # 盖帽到位判定的停留帧数（2026-08-28 用户「把灯冒盖上…火焰熄灭」：
                           #   夹爪距 CAP_BURNER < cap_cover_near 连续 15 帧 → cap settled →
                           #   火焰熄灭、帽锁灯口 → phase→done）
debug_lamp_move: true     # 调试（用户 2026-08-27「先把前面的动作都隐藏就先做这一个动作」）：
                           #   true = 跳过段1全部元动作，任务直进 move_lamp 相只跑 LampMovePass
                           #   抓灯移灯，一运行立即看到新抓法；false = 正常全流程
debug_cap_lamp: true      # 调试（2026-08-28 盖帽）：true = 跳过段1+移灯，任务直进 cap_lamp 相
                           #   只跑 CapLampPass 取帽盖灭（task 端把灯预摆移灯位+火焰点亮）；
                           #   false = 正常全流程（move_lamp 之后自然进入 cap_lamp）

# 阶段B 滴加（V7 步骤 2-3）：机械臂抓滴管吸样品瓶液 → 滴入试管出液柱。
# 夹爪阈值同 d3l（GRIP_DROPPER=0.0055 贴胶头、GRIP_SQUEEZE=0.002 挤胶头），
# 吸液-滴液一次持握内循环 sample_cycles 遍，每遍 4 滴（液柱 48mm < 上限 60mm）。
sample_cycles: 3              # 一次持握内「吸液-滴液」循环遍数
grasp_xy_threshold: 0.03      # 进近判定：TCP 距目标点 xy 水平距 < 3cm 视为到达
gripper_closed_threshold: 0.025   # 夹爪合拢（抓滴管完成 attached）
gripper_open_threshold: 0.03      # 夹爪松开（放回滴管 released）
squeeze_close_threshold: 0.0035   # 挤胶头（排空气/滴液瞬间，开度 < 此值）

# 实验结果输入接口（运行前 --result boiling_point=97 等覆盖；task 读 cfg.boiling_point 顶层镜像）
experiment_result:
  boiling_point:
    label: "测得液体沸点（°C）"
    type: number
    default: 100.0
boiling_point: 100.0    # 顶层镜像键（main.py 无条件写回 cfg.boiling_point，缺则 ConfigKeyError）

task:
  max_steps: 30000
  obj_paths: []   # 器材静态摆放，无需随机化

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    # 常规侧视机位（用户 z 由 1.05 改为 0.85，2026-08-25）；火焰可见性已确认，
    # 诊断机位已回退。B2 火焰 18mm 小，此机位焦距 10 下不框火焰属正常。
    # 2026-08-27 分辨率 1920→1024：1920 使 data_collector obs 缓存整集几十 GB → OOM SIGKILL
    # （视频流本身流式无碍，元凶是每 4 帧攒全分辨率图进内存 list，见 controller._cache_h5 过滤）。
    translation: [0.80, 0.50, 1.35]
    resolution: [1024, 1024]
    focal_length: 10
    orientation: [0.38519, 0.13095, 0.29403, 0.86489]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    # 2026-08-27 用户：camera_2 变特写镜头（温度计刻度/铁架台，从 -Y 朝 +Y 水平拍摄），
    # 原俯视总览删除。朝向 [w,x,y,z]=[0.7071,0.7071,0,0]（scipy 验证：前向 R@(0,0,-1)=(0,1,0)=+Y、
    # 图像上 R@(0,1,0)=(0,0,1)=世界+Z 直立、右向 +X）。温度计挂好后在 (0.5286,0.0029)
    # （挂环1.2517/泡尖0.9822，刻度≈1.03-1.25；2026-08-27 整套上移 2cm + 挂钩再 +1cm、柱加高到 1.27）；
    # 相机 x=0.5286 对准刻度、y=-0.75（离 0.75m）、
    # z=1.05=刻度中心偏下 → 水平看。focal 30：垂直窗口 0.52m，刻度区 0.22m 占 42%。
    # resolution 1024×1024（1920 触发 obs 缓存 OOM，见 controller._cache_h5 过滤；刻度区
    # 仍占 ~430px 可读，若需更细可单独上调此相机，_stack_camera_images 支持混合分辨率）。
    # 注意：camera_2 在 obs_names（h5 采集含它），1024 存档体积约为 512 基线的 4 倍。
    translation: [0.5286, -0.75, 1.05]
    resolution: [1024, 1024]
    focal_length: 30
    orientation: [0.7071, 0.7071, 0.0, 0.0]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    # 仅显示/视频（不在 obs_names，controller._cache_h5 过滤后不进 h5），分辨率不攒缓存
    resolution: [1024, 1024]
    image_type: "rgb"

robot:
  type: "franka"
  # 阶段B 滴加：2026-08-25 用户「位置太挤动作乱七八糟→再往后移动」。原 (0,0) 时滴液位
  # (0.4367,0.0029) 相对底座 y≈0 贴轴线（机械臂正前方低 z）→ IK 易奇异/动作乱。方向：
  # 向后=-Y（同 d2s 经验；-X 已试过超臂展——x=-0.10 架位 3D 距离 0.867 超 0.8557 达 1.1cm，
  # 勿动 x）。底座 y 0→-0.08：滴液位相对 y 0.083、各关键点 3D 距离架位 0.841 / 瓶口 0.736 /
  # 灯帽 0.805 均 < 臂展 0.8557（架位余量 1.5cm，若仍挤可微调到 -0.10 但余量仅 0.5cm）。
  # 横越一律走低空 TRANSIT_Z=1.15（水平持握压在钩卡箍底 1.246 之下，非 H=1.25——
  # 旧注释已过时；H=1.25 仅用于架子正上方取/放管的竖直提出/下探，无挂钩）。
  # 2026-08-27 钩卡箍顶 1.2573（上移 2cm + 再 +1cm），铁柱加高到 1.27 柱顶留白。
  position: [0.0, -0.08, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
