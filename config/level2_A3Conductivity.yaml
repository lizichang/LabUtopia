name: Level2_A3Conductivity

# A3 task/controller 已实现并注册（v1 = 竖直夹住玻璃皿提起来，PickSurfaceDish）；
# 场景布局见下方注释。运行：python main.py --config-name level2_A3Conductivity
task_type: "a3_conductivity"
controller_type: "a3_conductivity"

mode: "collect"

# 场景：a3_conductivity（A3 电导率测量，桌面 z=0.80，2m×2m 台面中心为原点）
# 布局（2026-08-27 二改 = 用户 Isaac 重摆后 scene-realign，tmp=a3_conductivity_tmp.usd 为真相，
# 全部器材围绕机械臂底座 (0.37,0.16) 环形摆放；gen verify 全绿，站间净距 ≥0.02m）：
#   电导率仪 (0.3982,-0.1054) 屏幕朝 +y，电极(+x 侧)朝 +x；z 0.80..1.032
#   样品烧杯 (0.6469,0.0880,0.8857) rotX(-135) 烧杯111——**完全复刻 tmp**（用户明确 tmp 才
#     对）：T(0.6469,0.0880,0.8857)+rotateXYZ(-135,0,0)，bbox 0.609..0.685/0.049..0.209/
#     0.765..0.925 与 tmp 逐位一致；距电极插座 ~0.32m（动态线缆 0.8m 内安全）
#   分析天平 (0.3442,0.5550) 盘顶 z 0.8475；表面皿 Ø60 贴盘顶（底 0.8474 顶 0.854）；
#   粉堆 scale0.5 落皿内（底 0.854）；无药匙/称量纸/洗杯
#   洗瓶 (0.64,0.36) rotZ180（tmp 里被翻转：红嘴朝 +X，对试管架方向），z 0.80..0.987
#   试管架 (0.8537,0.1763) z 0.80..0.917；玻璃棒 Ø6×261 立架内（底 0.80 顶 1.061）
#   机械臂底座 (0.37,0.16,0.71)：用户指定中央底座，全器材围绕；最远抓点=玻璃棒顶 3D 0.58m
#   （最紧站距 Meter~SampleBeaker ~0.03m，若手臂下探撞 meter 需把烧杯再外挪）
usd_path: "assets/scenes/a_instrument/a3_conductivity/a3_conductivity.usd"

max_episodes: 1

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

# 检测阈值（gripper 开度 = joint[7]，与 flametest/d2s/a1/a2 一致）
grasp_xy_threshold: 0.03        # 夹爪距抓点多近算"到位"
gripper_closed_threshold: 0.025 # 夹爪开合小于此值算"夹紧"
gripper_open_threshold: 0.03    # 夹爪开合大于此值算"松开"

task:
  max_steps: 30000
  obj_paths: []   # 器材静态摆放，无需随机化

cameras:
  # camera1：俯视全景——器材跨 x[-0.76,0.78] y[-0.63,0.46]，高位俯拍看全站间距
  #（复用 d3s camera2 的近俯视朝向；机位/朝向待用户目检微调）
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [0.10, 0.05, 2.10]
    resolution: [512, 512]
    focal_length: 12
    orientation: [0.9425, 0.10815, 0.03605, 0.31417]
    image_type: "rgb"

  # camera2：直拍电导率仪显示屏（用户要看读数，同 a1/a2）：机位 (0.05,0.75,1.25) 在
  # +y 屏前朝 -y，focal 35 让屏幕占画面
  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.05, 0.75, 1.25]
    resolution: [512, 512]
    focal_length: 35
    orientation: [0.0, 0.0, 0.4099, 0.9122]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [512, 512]
    image_type: "rgb"

robot:
  type: "franka"
  # 底座 (0.37,0.16,0.71)：用户指定中央底座，全器材围绕（最远抓点 玻璃棒顶 3D 0.58m ≤ 0.855m 臂展）
  position: [0.37, 0.16, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
