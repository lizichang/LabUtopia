name: Level2_A3Conductivity

# A3 task/controller 已实现并注册（v3 = ①竖直夹住玻璃皿提起来 PickSurfaceDish →
# ②夹着皿水平移动到烧杯口正上方 MoveDishAboveBeaker → ③倾斜皿倒粉 PourDishIntoBeaker）；
# 场景布局见下方注释。
# 运行：python main.py --config-name level2_A3Conductivity
task_type: "a3_conductivity"
controller_type: "a3_conductivity"

mode: "collect"

# 场景：a3_conductivity（A3 电导率测量，桌面 z=0.80，2m×2m 台面中心为原点）
# 布局（2026-08-28 三改 = 用户 Isaac 重摆后 scene-realign，tmp=a3_tmp.usd 为真相；
# 机械臂底座改 (0,0.12)，右区器材整体左移靠拢底座；gen verify 全绿，站间净距 ≥0.02m）：
#   电导率仪 (0.4349,-0.2130) rotZ+90 电极朝 +y/烧杯方向（机身 y 变长→-y 挪 6cm）；z 0.80..1.032
#   样品烧杯 (0.3520,0.0807,0.8857) rotX(-135) 烧杯111——**完全复刻 tmp**（用户明确 tmp 才
#     对）：T(0.3520,0.0807,0.8857)+rotateXYZ(-135,0,0)，bbox 0.314..0.390/0.041..0.202/
#     0.765..0.925 与 tmp 逐位一致
#   分析天平 (0.3442,0.5550) 盘顶 z 0.8475；表面皿 Ø60 贴盘顶（底 0.8474 顶 0.854）；
#   粉堆 scale0.25 落皿内（底 0.854）；无药匙/称量纸/洗杯
#   洗瓶 (0.3536,0.3062) rotZ180（tmp 里被翻转：红嘴朝 +X，对试管架方向），z 0.80..0.987
#   试管架 (0.5630,0.1989) z 0.80..0.917；玻璃棒 Ø6×261 立架内（底 0.80 顶 1.061）
#   机械臂底座 (-0.10,0.12,0.71)：2026-08-29 洗瓶横夹卡住→-X 挪 10cm；最远抓点=玻璃棒顶 3D 0.75m
#   （最紧站距 Meter~SampleBeaker ~0.022m）
usd_path: "assets/scenes/a_instrument/a3_conductivity/a3_conductivity.usd"

max_episodes: 1

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

# 检测阈值（gripper 开度 = joint[7]，与 flametest/d2s/a1/a2 一致）
grasp_xy_threshold: 0.03        # 夹爪距抓点多近算"到位"
gripper_closed_threshold: 0.025 # 夹爪开合小于此值算"夹紧"
gripper_open_threshold: 0.03    # 夹爪开合大于此值算"松开"

# 实验结果输入接口（运行前 --result conductivity=1.413 等；task 读 cfg.conductivity → 选对应
# 预烘焙读数屏）。屏幕读数由输入决定（A1 nD 同款：headless 下运行时改材质不渲染 → gen 预烘焙
# 每档一张贴图 + 一个 ScreenGlow_<key> prim，task 按 cfg.conductivity 只 show 一个）。档位须与
# meta_actions/constants.py 与 scripts/gen_a3_scene.py 的 CONDUCTIVITY_OPTIONS 三处一致，勿单边改。
experiment_result:
  conductivity:
    label: "电导率读数（mS/cm，显示屏显示值）"
    type: enum
    options: ["0.012", "0.250", "1.413", "12.88"]
    default: "1.413"

# 顶层镜像（写回目标）：结构化 config 需先声明字段，main.py 才能 cfg[field]=值 写回。
# 引号必须保留——"0.012"/"1.413" 是字符串 key 前缀；YAML 浮点 0.012 会变 0.012，str() 对不上档位。
conductivity: "1.413"

task:
  max_steps: 30000
  obj_paths: []   # 器材静态摆放，无需随机化

cameras:
  # camera1：顶部斜视（同 d3l camera1，2026-08-30 用户「像 d3l 中 camera1 一样的顶部斜视视角」）：
  # 机位 (0.50,0.30,1.15) 朝桌面工作区俯看（pitch≈52°），focal 17 框住站区
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [0.80, 0.50, 1.55]
    resolution: [512, 512]
    focal_length: 17
    orientation: [0.38519, 0.13095, 0.29403, 0.86489]
    image_type: "rgb"

  # camera2：正对导电率仪屏幕（2026-08-30 用户「调整到正对设备屏幕，能看到结果」+「逆时针
  # 旋转90度」）：屏幕中心 (0.3355,-0.265,0.858) 朝 -X（front 面，世界 y[-0.338,-0.192]
  # z[0.828,0.888]），机位放 -X 侧 0.35m、同一 y/z 水平正对（look +X）。orientation [w,x,y,z]
  # scalar-first、camera_axes="usd" 直接写 prim（同 A1 camera2）。首版 [0.7071,0,-0.7071,0]=
  # 绕Y -90°→相机 -Z 朝 +X 但 up=+Y（世界 up 是 +Z，故画面横躺90°）；改 [0.5,0.5,-0.5,-0.5]
  # = up 换 +Z（绕视轴 +X 逆时针滚90°），屏幕宽(Y)横、高(Z)竖、文字直立不镜像。focal 12→35
  # 让屏幕占画面 ~70%（水平 FOV 33.3°、0.35m 视场宽 0.21m、屏宽 0.146m）。
  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [-0.0145, -0.265, 0.858]
    resolution: [512, 512]
    focal_length: 35
    orientation: [0.5, 0.5, -0.5, -0.5]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [512, 512]
    image_type: "rgb"

robot:
  type: "franka"
  # 底座 (-0.10,-0.03,0.71)：2026-08-29 洗瓶 ORIENT_FWD 水平横夹在 z=0.88 卡住
  # （②③⑥⑦ force-done、⑦ IK FAIL）→ 底座往 -X 挪 10cm、再往 -Y 挪 15cm 给臂更多前伸空间。
  # 挪后最远抓点 玻璃棒顶 3D 0.75m ≤ 0.855m 臂展，仍够得着。
  position: [-0.10, -0.03, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
