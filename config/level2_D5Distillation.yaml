name: Level2_D5Distillation

task_type: "d5_distillation"
controller_type: "d5_distillation"

mode: "collect"

# 场景：d5_distillation（D5 蒸馏分离 · 忠实用户 Isaac tmp 组装件）
#   2026-09-03 由 scripts/gen_d5_final.py 从 d5_distillation_tmp.usd 烘焙：塌平 /root/World
#   嵌套、删空 _materials 碎片、按实测坐标补隐藏现象 prim（烧瓶气泡×30 / 牛角管口液滴×8 /
#   接液瓶内馏出液柱 / 酒精灯内外焰），材质绑定引用到 /World 时自动重映射（已 verify）。
#   酒精灯 (0.6981,0.461) 灯芯顶 0.9007；蒸馏烧瓶底 0.9091（内置样品液+沸石，tmp 自带）；
#   牛角管下尖 (0.6991,0.0759,0.8432) 罩锥形接液瓶 (0.7051,0.0787)（瓶口 0.8975）；
#   冷凝管由新支架 condenser_cradle_stand (0.704,0.2761) 承托；火柴 (0.5295,0.2918,0.8043)；
#   铁架台+ClampCondenser 夹持温度计 (泡尖 0.946，杆顶 1.2242)。
#   点火（LightFlamePass，坐标已对齐 constants.py 实测值）：火柴尾端原点 (0.5295,0.2918,
#     0.8043) 头朝 +X → 低位 z0.899 两段直角（先 +Y 到灯芯行 y0.4610、再 +X 把火柴头
#     送进灯芯 WICK(0.6981,0.4610,0.9007)）→ task 点火 → 火焰= B5 水滴形组 flicker。
#   ⚠ 机械臂底座 (-0.41,-0.41) 距装置约 1.3-1.4m 超 0.855m 臂展 → 用户定 = 西侧 (0.18,0.12)：
#     火柴抓点 ~0.44m / 点火 ~0.61m，均可达。
usd_path: "assets/scenes/d_wetchem/d5_distillation/d5_distillation.usd"

max_episodes: 1

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

# 检测阈值（一般不用改；gripper 开度 = joint[7]，与 flametest/d2s/d3l/d6/d7/d9/b2 一致）
grasp_xy_threshold: 0.03        # 夹爪距抓点多近算"到位"
gripper_closed_threshold: 0.025 # 夹爪开合小于此值算"夹紧"
gripper_open_threshold: 0.03    # 夹爪开合大于此值算"松开"

# 蒸馏现象相态时序（帧 @60fps，可调）：
#   ignite_dwell  点火后停留（火焰亮，未加热）
#   heat_dwell    加热期（气泡随进度渐起）→ 480 帧 ≈ 8s 加热到沸腾（温度计红柱随之升到 100°C）
#   boil_dwell    沸腾保持（气泡全开，180 帧 = 3s 可见沸腾）
#   之后 distilling 馏出液滴落收集 —— 用户要求：等看到烧瓶沸腾(~10s)后才有馏出液（11.5s 起）
#   result_hold   收集完成后火焰保持再熄灭
#   flame_fade    火焰熄灭帧数
ignite_dwell_frames: 30
heat_dwell_frames: 480
boil_dwell_frames: 180
result_hold_frames: 120
flame_fade_frames: 45

task:
  max_steps: 30000
  obj_paths: []   # 装置预组装静态摆放，无需随机化

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    # 从 +Y（北侧）朝 -Y 方向低水平视酒精灯火焰（用户 2026-09-03：要看得到火焰）。
    # 旧 3/4 高俯视 (z1.62 下看 ~30°) 被烧瓶身挡住灯芯火。现压低到 z1.05、几乎水平
    # (~9° 下俯) 直对灯芯 (0.74,0.46,0.90)：视线从灯上方空隙掠过 → 火焰入画。
    # P(0.74,1.45,1.05) T(0.74,0.46,0.90) q≈绕 YZ 面内轴 180°（w,x,y,z）。
    translation: [0.74, 1.05, 1.05]
    resolution: [1024, 1024]
    focal_length: 17
    orientation: [0.0, 0.0, 0.6519, 0.7586]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    # 顶部俯视装置集群，up=+Y
    translation: [0.74, -0.05, 1.55]
    resolution: [1024, 1024]
    focal_length: 17
    orientation: [0.96534, 0.26098, 0.0, 0.0]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [1024, 1024]
    image_type: "rgb"

robot:
  type: "franka"
  # 底座 (0.18,0.12)：用户定 = 移到装置西侧。旧 (-0.41,-0.41) 距装置集群 1.3-1.4m 超 0.855m
  # 臂展（点火不可达）。现 (0.18,0.12)：火柴抓点 (0.5775,0.2918) 水平 ~0.44m、点火 TCP
  # (0.6483,0.4610,0.899) 水平 ~0.54m，均 < 0.855m，可达。
  position: [0.18, 0.12, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
