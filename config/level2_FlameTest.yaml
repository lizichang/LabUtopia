name: Level2_FlameTest

task_type: "flametest"
controller_type: "flametest"

mode: "collect"

# 场景：lab_flametest（V7 C1 焰色反应专用布局，桌面 z=0.80）
# v24：本生灯 → 酒精灯（/World/AlcoholLamp，火焰 z 0.900-0.936，灯芯顶 0.9005）
# 铂丝/滴管竖直在试管架孔中：铂丝手柄顶 (0.3977,-0.0201,0.9756)、
# 滴管管顶 (0.3591,-0.0205,0.931)；表面皿固定 (0.20,0.02,0.80) 不再搬动
usd_path: "assets/chemistry_lab/lab_flametest/lab_flametest_v17.usd"

max_episodes: 1

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

# ---- 器材路径（FlameTestTask 使用，均为 /World 下顶层 prim）----
dish_path: "/World/SampleDish"          # 表面皿（v24：固定于 (0.20,0.02,0.80)）
hcl_path: "/World/HClBottle"            # 稀盐酸瓶（P2 旋塞 / P5 蘸酸）
dropper_path: "/World/Dropper"          # 胶头滴管（P3 吸酸滴 2-3 滴）
wire_path: "/World/PlatinumWire"        # 铂丝（P5-P12，抓最上端）
sample_path: "/World/SampleBottle"      # 待测固体样品瓶（P9 蘸粉末）
burner_path: "/World/AlcoholLamp"       # 酒精灯（P4 点燃 / P6-P10 灼烧 / P11 盖灭）
match_path: "/World/Match"              # 火柴（P4 点燃）
droplet_path: "/World/Droplet"          # 盐酸滴效果 prim（隐藏）
dish_acid_path: "/World/DishAcid"       # 皿内酸液效果 prim（隐藏）
# 焰色：yellow(Na) / purple(K) / green(Cu) / red(Ca,Sr) / blue / orange
flame_color: "yellow"

# 检测阈值与事件 dwell 帧数（一般不用改）
grasp_xy_threshold: 0.03        # 夹爪距抓取点多近算"到位"
gripper_closed_threshold: 0.025 # 夹爪开合小于此值算"夹紧"
gripper_open_threshold: 0.03    # 夹爪开合大于此值算"松开"
ignite_dwell_frames: 15         # 火柴头在灯口连续帧数后点着火
stain_dwell_frames: 150         # 铂丝尖端入外焰连续帧数后显示受染（≈3s@50Hz）
extinguish_dwell_frames: 15     # 灯帽盖灯口连续帧数后熄灭
drop_dwell_frames: 20           # 滴管口悬停帧数后滴第 1 滴
drop_interval_frames: 30        # 相邻两滴间隔帧数
n_drops: 3                      # 滴数（V7 文档 2-3 滴）

task:
  max_steps: 30000
  obj_paths: []   # 器材静态摆放，无需随机化

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    # v30.2 中景+广角：用户反馈"视野调大"。focal 40->28（FOV ~48°->~66°），
    # 眼位/朝向不变，同框容纳灯+皿+试管架更多全局上下文。原 focal40 太窄、
    # 只能看到灯+皿；原 (0.75,0.3,1.35)@focal14 灯仅 ~16px 又太小。
    translation: [0.50, 0.30, 1.15]
    resolution: [512, 512]
    focal_length: 10
    orientation: [0.38519, 0.13095, 0.29403, 0.86489]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    # v30.2 皿区广角：用户反馈"视野调大"。focal 28->20（FOV ~65°->~84°），
    # 眼位/朝向不变，皿+滴管+下坠液滴全程入画、四缘留白。原 focal28 太贴，
    # 皿占满画幅、滴管上端/液滴起点常出画。
    translation: [0.26, -0.06, 1.24]
    resolution: [512, 512]
    focal_length: 10
    orientation: [0.9425, 0.10815, 0.03605, 0.31417]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [512, 512]
    image_type: "rgb"

robot:
  type: "franka"
  position: [0.25, 0.32, 0.71]   # 底座靠回原位置方向（左下），火柴离机械臂更远；最远物品仍为 Match 0.69m，留 0.16m 余量

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
