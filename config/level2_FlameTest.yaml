name: Level2_FlameTest

task_type: "flametest"
controller_type: "flametest"

mode: "collect"

# 场景：lab_flametest（V7 C1 焰色反应专用布局，桌面 z=0.80）
# 铂丝 rotateY(120°) 斜置：手柄中心 (0.417,-0.14,0.867)，环中心 (0.511,-0.14,0.812)
# 试管架 (0.38,-0.14,0.80)，滴管竖直在架孔中 (0.416,-0.14,0.812)
usd_path: "assets/chemistry_lab/lab_flametest/lab_flametest_v17.usd"

max_episodes: 1

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

# ---- 器材路径（FlameTestTask 使用，均为 /World 下顶层 prim）----
dish_path: "/World/SampleDish"          # 表面皿（P1 移中央 / P13 清洗归位）
hcl_path: "/World/HClBottle"            # 稀盐酸瓶（P2 旋塞 / P5 蘸酸）
dropper_path: "/World/Dropper"          # 胶头滴管（P3 吸酸滴 2-3 滴）
wire_path: "/World/PlatinumWire"        # 铂丝（P5-P12）
sample_path: "/World/SampleBottle"      # 待测固体样品瓶（P9 蘸粉末）
burner_path: "/World/BunsenBurner"      # 本生灯（P4 点燃 / P6-P10 灼烧 / P11 盖灭）
match_path: "/World/Match"              # 火柴（P4 点燃）
droplet_path: "/World/Droplet"          # 盐酸滴效果 prim（隐藏）
jet_path: "/World/WaterJet"             # 洗瓶水柱效果 prim（隐藏）
dish_acid_path: "/World/DishAcid"       # 皿内酸液效果 prim（隐藏）
# 焰色：yellow(Na) / purple(K) / green(Cu) / red(Ca,Sr) / blue / orange
flame_color: "yellow"

# 检测阈值与事件 dwell 帧数（一般不用改）
grasp_xy_threshold: 0.03        # 夹爪距抓取点多近算"到位"
gripper_closed_threshold: 0.025 # 夹爪开合小于此值算"夹紧"
gripper_open_threshold: 0.03    # 夹爪开合大于此值算"松开"
ignite_dwell_frames: 15         # 火柴头在灯口连续帧数后点着火
stain_dwell_frames: 150         # 铂丝尖端入外焰连续帧数后显示受染（≈3s@50Hz）
extinguish_dwell_frames: 15     # 灯帽盖灯口连续帧数后熄灭
drop_dwell_frames: 20           # 滴管口悬停帧数后滴第 1 滴
drop_interval_frames: 30        # 相邻两滴间隔帧数
n_drops: 3                      # 滴数（V7 文档 2-3 滴）

task:
  max_steps: 30000
  obj_paths: []   # 器材静态摆放，无需随机化

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    # 特写视角对准本生灯口火焰（火焰 z 0.962-1.038，4cm 宽 7.6cm 高）。
    # v17.2 修复：focal 15mm 时火焰与浅蓝玻璃管同色系混淆、变黄区仅 23px；
    # 改 focal 25mm（距 0.54m 不变）火焰放大至约 93px，黄色铂丝手柄移出画面。
    # orientation 四元数顺序 (w,x,y,z)！看向 (0.36,0.18,0.99)
    translation: [0.75, 0.3, 1.35]
    resolution: [512, 512]
    focal_length: 25
    orientation: [0.54151, 0.24438, 0.33089, 0.73318]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    # 俯视全局视角：z 从 2.5 降到 1.5（距桌面 0.7m），focal 从 5 增到 12（FOV ~82°）
    # 桌面覆盖范围从 ~7m 缩小到 ~1.2m，正好覆盖焰色反应工作区（x:-0.3~0.75, y:-0.22~0.28）
    # 相机 x 从 0.1 移到 0.25，对准工作区中心
    translation: [0.25, 0, 1.5]
    resolution: [512, 512]
    focal_length: 12
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [512, 512]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.3, -0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
