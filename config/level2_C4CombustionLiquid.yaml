name: Level2_C4CombustionLiquid

task_type: "c4_combustion_liquid"
controller_type: "c4_combustion_liquid"

mode: "collect"

# 跳过 RMPFlow 控制器加载：catalogue 分层任务用 Lula IK 驱动轨迹，RMPFlow 只被无条件
# 创建 + reset 从不参与运动（纯模型加载开销，headless 首跑/反复起停易卡 GPU）。
use_rmpflow: false

# 场景：c4_combustion_liquid（C4 燃烧试验-液体样品，桌面 z=0.80）。
# 用户 2026-09-01 定稿：无铁架台；燃烧匙 combustion_spoon.usd 靠在试管架旁
# (0.636,0.3093,0.8068)（原厂碗朝上、把手斜向上 +X，不旋转）；药品瓶 sample_bottle.usd
# (0.50,0.55) 内 SampleLiquid 半瓶液，瓶盖摘下倒放瓶旁（瓶 -X 侧 45mm，密封面朝上）；
# 滴管 dropper.usd 右列最后一排（第7排）孔 (0.7385,0.5395)
# （用户 09-01 两改：第一排→第三排→定稿最后一排，远离燃烧匙把手/药品瓶，
# 右孔避开斜靠把手）；
# 酒精灯 (0.7094,-0.10) rot180 火焰初始隐藏（09-01 移灯到火柴正对 -Y），灯帽摘旁
# (0.5894,-0.10) 备盖灭；
# 火柴 (0.62,0.05)。药品瓶液体与碗内液体同色（SampleLiquid/SpoonLiquid_<色> 变体）。
usd_path: "assets/scenes/c_flame/c4_combustion_liquid/c4_combustion_liquid.usd"

max_episodes: 1

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

# 检测阈值（一般不用改；gripper 开度 = joint[7]，与 flametest/d2s/d3l 一致）
grasp_xy_threshold: 0.03        # 夹爪距滴管抓点多近算"到位"
gripper_closed_threshold: 0.025 # 夹爪开合小于此值算"夹紧"
gripper_open_threshold: 0.03    # 夹爪开合大于此值算"松开"
# 开合小于此值算"挤胶头"（排空气/滴液）。0.0035：持握开度 0.0055 之上留 0.002 裕量
# （防手指晃动误判挤），挤胶头 0.002 之下 0.0015（d3l 2026-08-14 开度减半后同步）
squeeze_close_threshold: 0.0035

# 第一步（滴管吸药品瓶液→滴入燃烧匙碗）重复遍数：多滴几滴让碗液更明显（液面逐滴升高）
drip_cycles: 1

# 第五步盖帽：夹爪盖到位（距灯口 < 1cm）连续帧数（≥此值判帽锁灯口、火焰熄灭）
cap_dwell_frames: 15

# 实验结果输入接口（运行前 --result liquid_color=<色> / --result combustion=<档> 等；
# task 读 cfg.liquid_color / cfg.combustion）
experiment_result:
  liquid_color:
    label: "药品瓶液体颜色（滴入燃烧匙碗同色）"
    type: enum
    options: [clear, red, blue, green, purple]
    default: clear
  combustion:
    label: "液体燃烧现象（碗入外焰：可燃液面点燃烧尽 / 不可燃沸腾蒸发）"
    type: enum
    options: [combustible, non_combustible]
    default: combustible
  flame_color:
    label: "液面燃烧火焰颜色（可燃液体点燃火焰色，用户 09-02「火焰颜色通过输入决定」）"
    type: enum
    options: [blue, yellow, orange, red, green, purple]
    default: blue

# 顶层镜像（写回目标）：结构化 config 需先声明字段，main.py 才能 cfg[field]=值 写回。
# task 直接读 cfg.liquid_color / cfg.combustion。
liquid_color: clear
combustion: combustible
flame_color: blue

task:
  max_steps: 30000
  obj_paths: []   # 器材静态摆放，无需随机化

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    # 全局概览（复用 C3 camera_1 眼位/朝向）：广角同框容纳灯+药品瓶+燃烧匙+试管架+滴管。
    translation: [0.80, 0.50, 1.55]
    resolution: [512, 512]
    focal_length: 10
    orientation: [0.38519, 0.13095, 0.29403, 0.86489]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    # 顶部俯视整个工作区（用户 09-01：原近景只看到桌子一部分；改 E1/D6 同款顶视
    # up=+Y、focal 17），机位 x=0.54 对中器材 bbox、y=0.0 补偿 20.7° 前倾（视心落
    # 器材中部 (0.54,0.28,0.85)）、抬高 1.60 俯拍全桌（x 0.31-0.76, y 0.01-0.56）。
    translation: [0.54, 0.0, 1.60]
    resolution: [512, 512]
    focal_length: 17
    orientation: [0.98374, 0.17962, 0.0, 0.0]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [512, 512]
    image_type: "rgb"

robot:
  type: "franka"
  position: [0.25, 0.32, 0.71]   # 与 C1/C3 同底座位（左下），供后续动作可达性校准

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
